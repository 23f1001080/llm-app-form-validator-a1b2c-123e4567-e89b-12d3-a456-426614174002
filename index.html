<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation Interface</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        /* Custom override for valid feedback, not strictly required by prompt but good for UX */
        .form-control.is-valid ~ .valid-feedback {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center mb-4">User Registration</h2>
            <form id="registration-form" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" placeholder="Enter your name" required>
                    <div id="name-feedback" class="invalid-feedback">
                        Name cannot be empty.
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <div id="email-feedback" class="invalid-feedback">
                        Please enter a valid email address.
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Minimum 8 characters" required>
                    <div id="password-feedback" class="invalid-feedback">
                        Password must be at least 8 characters long.
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="submit-button" disabled>Register</button>
            </form>
            <div id="form-result" class="mt-4 text-center"></div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameInput = document.querySelector('#name');
            const emailInput = document.querySelector('#email');
            const passwordInput = document.querySelector('#password');
            const submitButton = document.querySelector('#submit-button');
            const formResult = document.querySelector('#form-result');
            const registrationForm = document.querySelector('#registration-form');

            const nameFeedback = document.querySelector('#name-feedback');
            const emailFeedback = document.querySelector('#email-feedback');
            const passwordFeedback = document.querySelector('#password-feedback');

            // Validation functions
            function validateName() {
                const isValid = nameInput.value.trim() !== '';
                updateValidationState(nameInput, nameFeedback, isValid, 'Name cannot be empty.');
                return isValid;
            }

            function validateEmail() {
                const emailPattern = /^[\S]+@[\S]+\.[\S]+$/;
                const isValid = emailPattern.test(emailInput.value);
                updateValidationState(emailInput, emailFeedback, isValid, 'Please enter a valid email address.');
                return isValid;
            }

            function validatePassword() {
                const isValid = passwordInput.value.length >= 8;
                updateValidationState(passwordInput, passwordFeedback, isValid, 'Password must be at least 8 characters long.');
                return isValid;
            }

            // Helper to update Bootstrap validation classes and feedback messages
            function updateValidationState(inputElement, feedbackElement, isValid, invalidMessage) {
                if (isValid) {
                    inputElement.classList.remove('is-invalid');
                    inputElement.classList.add('is-valid');
                    // Bootstrap's .invalid-feedback is hidden by default when .is-invalid is not present
                } else {
                    inputElement.classList.remove('is-valid');
                    inputElement.classList.add('is-invalid');
                    feedbackElement.textContent = invalidMessage; // Set the specific invalid message
                }
            }

            // Checks all fields and updates submit button state
            function checkAllFields() {
                const isNameValid = validateName();
                const isEmailValid = validateEmail();
                const isPasswordValid = validatePassword();

                submitButton.disabled = !(isNameValid && isEmailValid && isPasswordValid);
                return (isNameValid && isEmailValid && isPasswordValid); // Return overall validity
            }

            // Event Listeners for real-time validation
            nameInput.addEventListener('input', checkAllFields);
            emailInput.addEventListener('input', checkAllFields);
            passwordInput.addEventListener('input', checkAllFields);

            // Handle form submission
            registrationForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Prevent default form submission

                // Re-run validation to ensure final state and update UI
                const allFieldsValid = checkAllFields();

                if (allFieldsValid) {
                    formResult.textContent = 'Success! Registration successful. Welcome.';
                    formResult.classList.remove('text-danger');
                    formResult.classList.add('text-success');

                    // Optional: Clear form after successful submission
                    registrationForm.reset();
                    // Reset validation states by removing classes
                    nameInput.classList.remove('is-valid', 'is-invalid');
                    emailInput.classList.remove('is-valid', 'is-invalid');
                    passwordInput.classList.remove('is-valid', 'is-invalid');
                    submitButton.disabled = true; // Disable button again after reset
                } else {
                    formResult.textContent = 'Please correct the errors in the form.';
                    formResult.classList.remove('text-success');
                    formResult.classList.add('text-danger');
                }
            });

            // Initial call to set the correct state of the submit button on page load
            checkAllFields();
        });
    </script>
</body>
</html>
